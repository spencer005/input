[package]
name = "input-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
slotmap = "1.1"
evdev = "0.13"
rustix = { version = "0.38", features = ["event", "fs"] }
bitvec = "1.0"
thiserror = "2.0"
tracing = "0.1"
smallvec = { git = "https://github.com/fereidani/rust-smallvec", features = ["extract_if", "may_dangle", "std"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
ahash = "0.8.12"
fxhash = "0.2.1"
nohash-hasher = "0.2.0"

[[bench]]
name = "input_bench"
harness = false

[[bench]]
name = "pure_alg_bench"
harness = false

[[bench]]
name = "simd_bench"
harness = false

[features]
default = []

